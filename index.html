<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Cloud That Wouldn’t Leave</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#14102a;--dusk:#4a4fb0;--lilac:#8a7fe8;--coral:#ff6b6b;--amber:#ff9a5a;--sign:#f5c842;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:#ffe9d6;font:11px/1.9 "Press Start 2P",ui-monospace,Menlo,monospace;height:100dvh;overflow:hidden}
#bar{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;z-index:6;display:flex;gap:6px;align-items:center;min-height:22px}
#bar i{width:14px;height:14px;background:#241d4a;border:2px solid var(--dusk)}
#bar i.on{background:var(--amber);border-color:var(--sign)}
#bar button{margin-left:8px}
.stage{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}.stage::-webkit-scrollbar{display:none}.pic{position:relative;height:100dvh;width:calc(100dvh*578/805);margin:0 auto}
.pic img{width:100%;height:100%;display:block;image-rendering:pixelated}
.pic:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(20,16,42,.18) 0 1px,transparent 1px 3px)}
.hs{position:absolute;background:none;border:0;cursor:pointer;z-index:2;padding:0}
.hs:after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;background:var(--sign);transform:rotate(45deg);animation:p 1.2s steps(2) infinite;box-shadow:0 0 0 2px var(--ink)}
.hs.seen:after{background:#5b5a99;animation:none}
.hs:hover,.hs:focus-visible{outline:2px dashed var(--sign)}
@keyframes p{50%{opacity:.25}}
#box{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:7;width:min(100%,600px);height:20dvh;overflow-y:auto;background:rgba(20,16,42,.86);border:4px solid var(--amber);border-bottom:0;padding:12px 16px;display:none}#box.on{display:block}
#box p{margin:0;font-size:10px}
#nx{position:absolute;right:12px;bottom:6px;color:var(--sign);animation:p .8s steps(2) infinite}
button.b{font:inherit;color:var(--ink);background:var(--amber);border:0;padding:8px 10px;cursor:pointer;box-shadow:4px 4px 0 var(--coral);margin:4px 4px 0 0;text-align:left}
button.b:hover{background:var(--sign)}
#bar button.b{font-size:9px;padding:6px 8px}
#title{position:fixed;inset:0;z-index:5;background:rgba(20,16,42,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:16px}
#title h1{font-size:18px;line-height:1.6;margin:0;color:var(--amber);text-shadow:3px 3px 0 var(--coral)}
#title small{font-size:9px;color:#d9d3ff}
@media (prefers-reduced-motion:reduce){.hs:after,#nx{animation:none}}
</style></head><body>

<div id="title"><h1>The Cloud<br>That Wouldn’t<br>Leave</h1><small>A short mystery</small><button class="b" id="go">Begin</button></div>
</div></div>
<div id="box"><p id="t"></p><span id="nx" hidden>▼</span><div id="ch"></div></div>
<script>
const H={
cloud:{r:[15,4,55,50],c:"The cloud hasn’t moved",l:["Three hours of sunset, and this cloud hasn’t shifted an inch.","It leans out over the street, like a face looking down.","Clue: the cloud has been frozen since 17:40."]},
wire:{r:[0,7,16,9],c:"The wire hums",l:["The power line hums, a little too high.","Each time the hum rises, the cloud’s edges glow brighter.","Clue: the cloud glows in time with the hum."]},
b1:{r:[4,70,27,14],c:"Network at 17:40",l:["“Netz geht’s los!” A new network goes live today.","The small print: switched on at 17:40.","Clue: the network started the very minute the cloud stopped."]},
b2:{r:[51,71,24,11],c:"The reflection moves",l:["The middle billboard is dark. Just glass.","In the reflection, the cloud blinks slowly. In the sky, it doesn’t.","Clue: the reflected cloud moves. The real one doesn’t."]},
b3:{r:[79,72,16,10],c:"A scratched word",l:["A huge red “55”. Half price on something.","Someone scratched one word into the corner: LISTEN.","Clue: a note says LISTEN."]},
win:{r:[73,61,15,9],c:"Someone watching",l:["One lit window in a dark building.","The lamp flickers in the rhythm of the hum. A figure stands there, facing the cloud.","Clue: someone has been watching from that window."]},
trees:{r:[24,57,26,13],c:"No birds",l:["Black branches against the glow. Not one bird.","Every branch points toward the cloud.","Clue: the birds are gone."]},
road:{r:[0,88,100,12],c:"An empty street",l:["No cars. No steps. Not for hours.","The lane markings run straight up toward the cloud.","Clue: everyone left the street."]}};
const found=new Set(),$=id=>document.getElementById(id),t=$("t"),nx=$("nx"),ch=$("ch"),bar=$("bar");
let q=[],cb=null,typing=0,full="";
const N=Object.keys(H).length;
function type(s){full=s;t.textContent="";let i=0;clearInterval(typing);nx.hidden=true;
 typing=setInterval(()=>{t.textContent=s.slice(0,++i);if(i>=s.length){clearInterval(typing);typing=0;nx.hidden=false}},22)}
function say(lines,done){q=[...lines];cb=done||null;ch.innerHTML="";$("box").classList.add("on");next()}
function next(){if(typing){clearInterval(typing);typing=0;t.textContent=full;nx.hidden=false;return}
 if(q.length){type(q.shift())}else if(cb){const f=cb;cb=null;f()}else if(!ch.children.length)$("box").classList.remove("on")}
$("box").onclick=next;
function bar_(){bar.innerHTML="";for(let i=0;i<N;i++){const e=document.createElement("i");if(i<found.size)e.className="on";bar.append(e)}
 if(found.size>=5){const b=document.createElement("button");b.className="b";b.textContent="Name your theory";b.onclick=theory;bar.append(b)}}
function btn(txt,fn){const b=document.createElement("button");b.className="b";b.textContent=txt;b.onclick=e=>{e.stopPropagation();fn()};ch.append(b)}
function theory(){say(["What is the cloud?"],()=>{
 btn("Just strange weather",()=>end(0));btn("Someone at the window",()=>end(1));btn("The new network woke it up",()=>end(2))})}
const E=[["Ending 1 of 3","You decide it’s weather. A freak of the air. You walk home with your hands in your pockets.","Behind you, very slowly, the cloud turns to follow."],
["Ending 2 of 3","You cross the street and knock. Nobody answers. The lamp is on a timer, and the figure is a coat on a hanger.","Whatever is watching isn’t in the building. It’s above it."],
["Ending 3 of 3: the truth","The network switched on at 17:40, and something up there tuned in. It has been listening ever since: to the wire, to the window, to you.","You whisper, “Hello.” The cloud exhales. The hum falls silent, the birds return, and the sky finally lets the night come."]];
function end(i){ch.innerHTML="";const e=E[i];say([e[1],e[2],e[0]],()=>{btn("Look around again",()=>say(["The cloud waits."]));btn("Play again",()=>{found.clear();document.querySelectorAll(".hs").forEach(h=>h.classList.remove("seen"));bar_();$("title").style.display="flex"})})}
for(const k in H){const d=H[k],b=document.createElement("button");b.className="hs";b.setAttribute("aria-label",d.c);
 b.style.cssText=`left:${d.r[0]}%;top:${d.r[1]}%;width:${d.r[2]}%;height:${d.r[3]}%`;
 b.onclick=()=>{if(found.has(k)){say(["You’ve seen this already: "+d.c.toLowerCase()+"."]);return}
  found.add(k);b.classList.add("seen");bar_();say(d.l,found.size==5?()=>say(["That might be enough to name a theory. Or keep looking."]):null)};
 document.querySelector(".pic").append(b)}
$("go").onclick=()=>{$("title").style.display="none";say(["17:52. You’re walking home along the usual street.","The sky is on fire, and it has been for three hours.","Tap the glowing diamonds. Find out why."])};
bar_();{const s=document.querySelector(".stage"),p=document.querySelector(".pic");s.scrollLeft=(p.offsetWidth-innerWidth)/2}
</script></body></html>
